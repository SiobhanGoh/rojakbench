name: Publish site
on:
  push:
    branches: [main]
    paths: ["site/**", "results/**"]
  workflow_run:
    workflows: ["Weekly leaderboard", "Inbox"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp results/leaderboard.json _site/data/
          [ -f results/agreement.json ] && cp results/agreement.json _site/data/ || true
          # Stamp each script and stylesheet with this commit, so a browser never pairs a new
          # page with an old cached script.
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(app\.js|author\.js|style\.css)\"#\1=\"\2?v=$v\"#g" _site/*.html
          grep -o '\(app\|author\)\.js?v=[0-9a-f]*\|style\.css?v=[0-9a-f]*' _site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
